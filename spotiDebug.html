<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiMood</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            padding: 20px 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 1000px;
            width: 90%;
            margin: 20px auto
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #1DB954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            margin-bottom: 30px;
            opacity: 0.8;
            font-size: 1.1em;
        }

        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        .controls {
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #1DB954, #1ed760);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .mood-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mood-emoji {
            font-size: 3em;
            margin: 10px 0;
        }

        .recommendation {
            background: rgba(29, 185, 84, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(29, 185, 84, 0.3);
        }

        .song-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #1DB954;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .spotify-link {
            background: #1DB954;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .spotify-link:hover {
            background: #1ed760;
            transform: translateY(-1px);
        }

        .debug {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 0.8em;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            button {
                padding: 12px 24px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 SpotiMood</h1>
        <p class="subtitle">SpotiMood = emotions.toMusic()</p>
        
        <video id="video" autoplay playsinline></video>
        
        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="scanBtn" disabled>Scan My Mood</button>
        </div>
        
        <div class="instructions">
            Click "Start Camera" and allow camera access, then click "Scan My Mood" for personalized song recommendations.
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Analyzing your mood...</p>
        </div>
        
        <div id="moodDisplay" class="mood-display" style="display: none;">
            <div class="mood-emoji" id="moodEmoji">😐</div>
            <h3>Detected Mood: <span id="moodText">Neutral</span></h3>
        </div>
        
        <div id="recommendation" class="recommendation" style="display: none;">
            <h3>Your Song:</h3>
            <div class="song-title" id="songTitle">Song will appear here</div>
            <a id="spotifyLink" class="spotify-link" href="#" target="_blank">Open in Spotify</a>
        </div>

        <div id="debug" class="debug">
            <strong>Debug Info:</strong><br>
            <div id="debugContent">Initializing...</div>
        </div>
    </div>

    <script src="./face-api.min.js"></script>

    <script>
        let video, canvas, ctx;
        let isAnalyzing = false;
        let modelsLoaded = false;
        
        const moodEmojis = {
            happy: '😊',
            sad: '😢',
            neutral: '😐',
            angry: '😠',
            surprised: '😮'
        };

        function addDebug(message) {
            const debugContent = document.getElementById('debugContent');
            const timestamp = new Date().toLocaleTimeString();
            debugContent.innerHTML += `<br>[${timestamp}] ${message}`;
            debugContent.scrollTop = debugContent.scrollHeight;
            console.log(message);
        }
        
        async function getSongRecommendation(mood) {
            const prompt = `Recommend one Spotify song for someone who is feeling ${mood}. Only return the song name and artist in this format: 'Song Name by Artist'. No explanation or additional text. Don't repeat the same songs.`;
            
            const payload = {
                messages: [{ role: "user", content: prompt }]
            };
            
            const headers = {
                "Content-Type": "application/json"
            };
            
            try {
                const response = await fetch("https://ai.hackclub.com/chat/completions", {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    const songRecommendation = result?.choices?.[0]?.message?.content || "";
                    return songRecommendation;
                } else {
                    addDebug(`API Error: ${response.status}`);
                    return "Error contacting recommendation service";
                }
            } catch (error) {
                addDebug(`API Error: ${error.message}`);
                return "Error getting recommendation";
            }
        }
        
        function openSpotifySearch(songRecommendation) {
            const searchQuery = encodeURIComponent(songRecommendation);
            const spotifyUrl = `https://open.spotify.com/search/${searchQuery}`;
            return spotifyUrl;
        }
        
        async function loadFaceAPIModels() {
            addDebug('Loading Face-API models...');
            const MODEL_URL = './weights';

            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                addDebug('Face-API models loaded successfully');
                modelsLoaded = true;
                return true;
            } catch (error) {
                addDebug(`Error loading Face-API models: ${error.message}`);
                modelsLoaded = false;
                return false;
            }
        }

        async function startCamera() {
            try {
                addDebug('Requesting camera access...');
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    } 
                });
                
                video = document.getElementById('video');
                video.srcObject = stream;
                
                video.onloadedmetadata = async function(e) {
                    video.play();
                    addDebug(`Video ready: ${video.videoWidth}x${video.videoHeight}`);
                    
                    // Load models after video is ready
                    if (!modelsLoaded) {
                        await loadFaceAPIModels();
                    }
                    
                    document.getElementById('scanBtn').disabled = false;
                };
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').textContent = 'Camera Active';
                addDebug('Camera started successfully');
                
            } catch (err) {
                addDebug(`Camera error: ${err.message}`);
                alert('Error accessing camera. Please make sure you have granted camera permissions.');
            }
        }
        
        async function detectMood() {
            if (!video || !video.videoWidth || !video.videoHeight) {
                addDebug('Video not ready for detection');
                return 'neutral';
            }

            if (!modelsLoaded) {
                addDebug('Models not loaded, using random mood');
                const moods = ['happy', 'sad', 'neutral', 'angry', 'surprised'];
                return moods[Math.floor(Math.random() * moods.length)];
            }

            try {
                addDebug('Detecting faces...');
                
                const detections = await faceapi
                    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ 
                        inputSize: 416, 
                        scoreThreshold: 0.5 
                    }))
                    .withFaceExpressions();
            
                addDebug(`Found ${detections.length} face(s)`);
                
                if (detections.length > 0) {
                    const expressions = detections[0].expressions;
                    let detectedMood = 'neutral';
                    let highestValue = 0;

                    const emotionMapping = {
                        'happy': 'happy',
                        'sad': 'sad',
                        'angry': 'angry',
                        'surprised': 'surprised',
                        'neutral': 'neutral',
                        'fearful': 'surprised',
                        'disgusted': 'angry'
                    };

                    // Debug expressions
                    let expressionDebug = 'Expressions: ';
                    for (const [emotion, confidence] of Object.entries(expressions)) {
                        expressionDebug += `${emotion}: ${(confidence * 100).toFixed(1)}% `;
                        if (confidence > highestValue && emotionMapping[emotion]) {
                            highestValue = confidence;
                            detectedMood = emotionMapping[emotion];
                        }
                    }
                    addDebug(expressionDebug);
                    addDebug(`Detected mood: ${detectedMood} (${(highestValue * 100).toFixed(1)}%)`);

                    return detectedMood;
                } else {
                    addDebug('No face detected in frame');
                    return 'neutral';
                }
            } catch (error) {
                addDebug(`Face detection error: ${error.message}`);
                return 'neutral';
            }
        }

        async function scanMood() {
            if (isAnalyzing) return;
            
            isAnalyzing = true;
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('moodDisplay').style.display = 'none';
            document.getElementById('recommendation').style.display = 'none';
            
            try {
                // Wait a moment for the video to stabilize
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const mood = await detectMood();
                
                document.getElementById('moodEmoji').textContent = moodEmojis[mood];
                document.getElementById('moodText').textContent = mood.charAt(0).toUpperCase() + mood.slice(1);
                document.getElementById('moodDisplay').style.display = 'block';
                
                addDebug(`Getting song recommendation for mood: ${mood}`);
                const recommendation = await getSongRecommendation(mood);
                
                document.getElementById('songTitle').textContent = recommendation;
                const spotifyUrl = openSpotifySearch(recommendation);
                document.getElementById('spotifyLink').href = spotifyUrl;
                document.getElementById('recommendation').style.display = 'block';
                
                addDebug(`Recommendation: ${recommendation}`);
                
            } catch (error) {
                addDebug(`Mood analysis error: ${error.message}`);
                alert('Error analyzing mood. Please try again.');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('scanBtn').disabled = false;
                isAnalyzing = false;
            }
        }
        
        // Initialize
        addDebug('SpotiMood initialized');
        
        document.getElementById('startBtn').addEventListener('click', startCamera);
        document.getElementById('scanBtn').addEventListener('click', scanMood);
        
        document.addEventListener('keydown', (event) => {
            if (event.key === 's' || event.key === 'S') {
                if (!document.getElementById('scanBtn').disabled) {
                    scanMood();
                }
            }
        });
    </script>
</body>
</html>
